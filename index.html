<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Devraj Anand | Study Portal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f6fb;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#111827,#2563eb);
    color:white;
    text-align:center;
    padding:45px 20px;
}

header h1{
    font-size:42px;
    margin-bottom:10px;
}

header p{
    font-size:18px;
}

.container{
    max-width:1100px;
    margin:40px auto;
    padding:0 20px;
}

.heading{
    text-align:center;
    margin-bottom:30px;
}

.heading h2{
    font-size:30px;
}

.heading p{
    color:#666;
    margin-top:8px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:22px;
}

.card{
    display:block;
    background:white;
    text-decoration:none;
    color:#172033;
    padding:35px 20px;
    text-align:center;
    border-radius:18px;
    box-shadow:0 6px 20px rgba(0,0,0,.08);
    transition:.25s;
}

.card:hover{
    transform:translateY(-7px);
    box-shadow:0 12px 28px rgba(0,0,0,.15);
}

.icon{
    font-size:50px;
    margin-bottom:15px;
}

.card h3{
    font-size:23px;
    margin-bottom:8px;
}

.card p{
    color:#666;
}

footer{
    margin-top:60px;
    background:#111827;
    color:white;
    text-align:center;
    padding:22px;
}
</style>
</head>

<body>

<header>
    <h1>Devraj Anand</h1>
    <p>Study • Knowledge • Motivation</p>
</header>

<div class="container">

    <div class="heading">
        <h2>📚 Study Portal</h2>
        <p>Choose your section</p>
    </div>

    <div class="cards">

        <a href="english.html" class="card">
            <div class="icon">📖</div>
            <h3>English</h3>
            <p>Grammar • Vocabulary • Practice</p>
        </a>

        <a href="gk.html" class="card">
            <div class="icon">🌍</div>
            <h3>GK / GS</h3>
            <p>History • Geography • Polity • Science</p>
        </a>

        <a href="motivation.html" class="card">
            <div class="icon">🔥</div>
            <h3>Motivation</h3>
            <p>Study Motivation & Inspiration</p>
        </a>

    </div>

</div>

<footer>
    © 2026 Devraj Anand | Study Portal
</footer>

</body>
</html>
