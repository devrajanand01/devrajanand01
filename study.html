<!DOCTYPE html>

<head>

<title>Study & Exam Prep | Devraj Anand</title>

<style>

    font-family:Arial,sans-serif;
    background:#0b1020;

}

.card h2{

}

.card p{

}

.back{

    padding:12px 20px;
    background:#8b9dff;
    color:#10152b;
    border-radius:10px;
    font-weight:bold;
    text-decoration:none;
    margin-bottom:40px;
}

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>📚 Study & Exam Prep</h1>

<div class="grid">

    <div class="card">

        <p>SSC CGL</p>

    <div class="card">
